services:
  - type: web
    name: lungguide-ai
    env: python

    buildCommand: >
      cd frontend &&
      npm install &&
      npm run build &&
      cd ../backend &&
      pip install -r requirements.txt &&
      python scripts/ingest.py

    startCommand: >
      uvicorn app.main:app
      --app-dir backend
      --host 0.0.0.0
      --port $PORT

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash

      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2

      - key: RETRIEVAL_TOP_K
        value: "5"

      - key: MIN_RELEVANCE_SCORE
        value: "0.28"

      - key: CHUNK_SIZE
        value: "800"

      - key: CHUNK_OVERLAP
        value: "120"

      - key: BACKEND_HOST
        value: "0.0.0.0"

      - key: BACKEND_PORT
        value: "8000"

      - key: CORS_ORIGINS
        value: "*"